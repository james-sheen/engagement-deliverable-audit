[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engagement-deliverable-audit"
# Read from `src/engagement_deliverable_audit/__init__.py` rather than written
# here. Two literals that happen to agree is the arrangement that drifts: a bump
# in one place ships a wheel whose `__version__` disagrees with its own metadata
# and nothing notices. Every sibling repository was moved off it after exactly
# that.
dynamic = ["version"]
description = "An engagement's deliverables, against the statement of work that declared them"
readme = "README.md"
# Both extras below resolve only on 3.10 or later, because `presence-audit` and
# `arbiter-engine` each declare `>=3.10` in their own metadata. A range is a
# claim about every interpreter in it, so this names the floor the package as
# declared can actually meet rather than the one bare Stage 1 could.
requires-python = ">=3.10"
# PEP 639 SPDX expression, which is why the build requirement above is
# `setuptools>=77`: the string form of this field is not understood before that.
# Deliberately NO `License :: OSI Approved ::` classifier -- the index rejects
# the two together, and a clean local build is not the check that catches it.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# ONE IMPLEMENTATION, AND THE DEPENDENCY THAT BUYS IT. A sibling keeps Stage 1
# dependency-free by writing its own three-valued comparison beside the shared
# core's, and asserting the two agree. That assertion was measured comparing
# states, counts and the presence of a finding -- and not the verdict, which the
# two paths disagree about for the same walk. A second implementation is a second
# place for the answer to live, and the test that was meant to bind them could
# not see the thing a consumer acts on.
#
# So this package has no second implementation. `presence` is the core's diff,
# and the core is a hard dependency rather than an extra. The cost is real: a
# bare install is no longer nothing. The thing bought is that there is exactly
# one answer to *which deliverables are moving*.
#
# MEASURED FLOOR, by `battery/probe_pin.py`. 0.1.7 is the first release that
# publishes `presence_audit.exit_contract`; in 0.1.6 that module does not exist,
# and the suite fails there on the one test that composes against it. The floor
# is the release the thing this package needs first appeared in, which is what
# makes it a specification rather than the number that happened to be newest.
dependencies = ["presence-audit>=0.1.7,<0.2"]

[project.optional-dependencies]
# MEASURED FLOOR, and it is three releases lower than the one declared here
# while this was still a plan. `battery/probe_pin.py` installed every release
# below the old floor and ran the suite against each: 0.1.10 through 0.1.13 pass,
# 0.1.9 and below fail, and the failure is `describe_gate` reading
# `unread_properties` -- a field the engine added in 0.1.10 and which therefore
# cannot be read before it. 0.1.13 was the newest release when the design was
# written, which is a date and not a reason.
#
# So the floor is 0.1.10, the pin now claims four releases instead of one, and
# all four were installed and run rather than reasoned about.
detect = ["arbiter-engine>=0.1.10,<0.2"]

[project.scripts]
engagement-deliverable-audit = "engagement_deliverable_audit.cli:main"

# How this vertical reaches the core: the group is the core's, the module is this
# package's. A plain install is enough for the core to know this domain exists,
# with no edit on its side. A plugin that fails to load is a FAILURE there and
# not a skip, which is the behaviour that makes this safe to declare -- a broken
# registration is loud rather than absent.
[project.entry-points."presence_audit.plugins"]
engagement = "engagement_deliverable_audit.vertical:register"

[tool.setuptools.dynamic]
version = {attr = "engagement_deliverable_audit.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
