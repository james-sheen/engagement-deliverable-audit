# The suite, and then the three gates the suite cannot enforce on its own.
#
# All three are backstops for things that live OUTSIDE a commit's content.
# `core.hooksPath` is per-clone, so the client-side hook is unset in every fresh
# clone until somebody remembers; a commit message is the one published surface
# no later commit can correct; and a commit's authorship is neither its message
# nor a file in it, so nothing that reads the tree can see it. Client-side is
# convenience. This is the enforcement.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just one this workflow
  # happened to name. The floor is 3.10 because both extras resolve only there.
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . pytest

      - name: Suite
        # `-p no:randomly` is deliberately absent: order dependence is a defect
        # worth finding. `--strict-markers` so a typo in a marker is an error
        # rather than a silently unselected test.
        run: python3 -m pytest tests/ -q --strict-markers

      - name: No test was skipped
        # A skip is how a check stops running without anybody noticing. If one is
        # ever legitimate here it gets a name and a reason in this step, not a
        # silent line in a log nobody opens.
        run: |
          set -euo pipefail
          python3 -m pytest tests/ -q --strict-markers 2>&1 | tee /tmp/out.txt
          if grep -qE '[0-9]+ skipped' /tmp/out.txt; then
            echo "::error::a test was skipped; name it here or fix it"
            exit 1
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message and authorship steps need the
          # commits in this push, and the default depth of 1 would leave them
          # checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED
