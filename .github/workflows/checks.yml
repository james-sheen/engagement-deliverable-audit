# The suite, and then the three gates the suite cannot enforce on its own.
#
# All three are backstops for things that live OUTSIDE a commit's content.
# `core.hooksPath` is per-clone, so the client-side hook is unset in every fresh
# clone until somebody remembers; a commit message is the one published surface
# no later commit can correct; and a commit's authorship is neither its message
# nor a file in it, so nothing that reads the tree can see it. Client-side is
# convenience. This is the enforcement.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every interpreter `requires-python` admits, not just one this workflow
  # happened to name. The floor is 3.10 because both extras resolve only there.
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # `[detect]` is installed on purpose: two of the four guards ask the
        # engine where its silence lists are and which side of a declared bound
        # fires, so without it they do not skip, they fail to import. The core
        # itself is no longer an extra -- it is a hard dependency, for the reason
        # recorded in `pyproject.toml`.
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[detect,grade]' pytest

      - name: Suite
        # `-p no:randomly` is deliberately absent: order dependence is a defect
        # worth finding. `--strict-markers` so a typo in a marker is an error
        # rather than a silently unselected test.
        run: python3 -m pytest tests/ -q --strict-markers

      - name: No test was skipped
        # A skip is how a check stops running without anybody noticing. If one is
        # ever legitimate here it gets a name and a reason in this step, not a
        # silent line in a log nobody opens.
        run: |
          set -euo pipefail
          python3 -m pytest tests/ -q --strict-markers 2>&1 | tee /tmp/out.txt
          if grep -qE '[0-9]+ skipped' /tmp/out.txt; then
            echo "::error::a test was skipped; name it here or fix it"
            exit 1
          fi

      - name: The same suite, from the sdist this tree builds
        if: matrix.python-version == '3.12'
        # THE ARTIFACT, NOT THE CHECKOUT. A packager or a reviewer runs the suite
        # from the sdist, and on 2026-09-26 five of the nine sdists in this family
        # could not: each carried tests/ without files those tests import or open,
        # so collection stopped and nothing ran, while twine, the metadata and a
        # clean wheel install all passed over it. So the suite runs again from the
        # unpacked sdist and from `git archive HEAD`, neither with a `.git`, and
        # every test must answer the same on both sides: a test that needs a
        # repository skips on both, and a file the sdist leaves out cannot hide.
        # The package is reinstalled from the sdist first, so what imports is
        # what a wheel built from the artifact would install.
        env:
          REINSTALL: "yes"
          PRE: ""
        run: |
          set -euo pipefail
          T="${RUNNER_TEMP:-/tmp}/sdist-check"
          rm -rf "${T}" && mkdir -p "${T}/tree" "${T}/unpacked"
          git archive HEAD | tar -x -C "${T}/tree"
          python3 -m pip install --quiet build
          python3 -m build --sdist --outdir "${T}/dist" . > "${T}/build.log"
          tar -xzf "${T}"/dist/*.tar.gz -C "${T}/unpacked" --strip-components=1
          test ! -e "${T}/unpacked/.git"
          if [ "${REINSTALL}" = yes ]; then
            (cd "${T}/unpacked" && python3 -m pip install --quiet --no-deps --force-reinstall .)
          fi
          for side in tree unpacked; do
            (cd "${T}/${side}" && { [ -z "${PRE}" ] || python3 ${PRE} > /dev/null; } \
               && python3 -m pytest tests/ -q -p no:cacheprovider --junitxml="${T}/${side}.xml") \
               > "${T}/${side}.log" 2>&1 || true
          done
          python3 - "${T}" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          T = pathlib.Path(sys.argv[1])
          def outcomes(side):
              report = T / f"{side}.xml"
              if not report.is_file():
                  print((T / f"{side}.log").read_text()[-3000:])
                  sys.exit(f"::error::the {side} run wrote no report")
              out = {}
              for case in ET.parse(report).getroot().iter("testcase"):
                  kinds = {child.tag for child in case}
                  out[f"{case.get('classname')}::{case.get('name')}"] = (
                      "failed" if "failure" in kinds else "error" if "error" in kinds
                      else "skipped" if "skipped" in kinds else "passed")
              return out
          tree, sdist = outcomes("tree"), outcomes("unpacked")
          if not tree:
              sys.exit("::error::the tracked tree collected nothing, so there is nothing to compare")
          broken = sorted(k for k, v in sdist.items() if v in ("failed", "error"))
          missing = sorted(set(tree) - set(sdist))
          extra = sorted(set(sdist) - set(tree))
          changed = sorted(k for k in set(tree) & set(sdist) if tree[k] != sdist[k])
          for label, keys in (("fails when run from the sdist", broken),
                              ("is in the tree and not in the sdist", missing),
                              ("is in the sdist and not in the tree", extra),
                              ("answers differently from the sdist", changed)):
              for key in keys[:25]:
                  print(f"::error::{key} {label} (tree: {tree.get(key)}, sdist: {sdist.get(key)})")
          if broken or missing or extra or changed:
              print((T / "unpacked.log").read_text()[-3000:])
              sys.exit(1)
          count = lambda outcome: sum(1 for v in sdist.values() if v == outcome)
          print(f"  the sdist answers exactly as the tracked tree does: {len(sdist)} tests, "
                f"{count('passed')} passed, {count('skipped')} skipped")
          PY

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message and authorship steps need the
          # commits in this push, and the default depth of 1 would leave them
          # checking only the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hygiene sweep
        # The same check the hook runs, over the whole tree rather than the
        # staged diff. This is the backstop for every commit made from a clone
        # where the hook was never enabled -- `core.hooksPath` is per-clone, so
        # that is every fresh clone until somebody remembers.
        run: python3 tools/hygiene_check.py --all

      - name: Commit messages
        # The commit-msg hook's backstop, and the reason this is not optional: a
        # message is the one published surface no later commit can correct.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
            echo "checking $(echo "$LIST" | grep -c . ) commit message(s) in $BASE..${{ github.sha }}"
          fi
          FAILED=0
          for SHA in $LIST; do
            git log -1 --format=%B "$SHA" > /tmp/msg.txt
            echo "--- $SHA"
            python3 tools/commit_msg_check.py /tmp/msg.txt || FAILED=1
          done
          exit $FAILED

      - name: Authorship
        # A commit's author is neither its message nor a file in it, so neither
        # check above can see it. A local `user.email` quietly beat the global
        # one and a personal address reached 24 published commits. The hook
        # checks the setting before the commit; this checks the RESULT after it,
        # which is the thing that actually gets published.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before || '' }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIST=$(git rev-parse HEAD)
          else
            LIST=$(git rev-list "$BASE..${{ github.sha }}")
          fi
          FAILED=0
          for SHA in $LIST; do
            for WHO in $(git log -1 --format='%ae%n%ce' "$SHA"); do
              case "$WHO" in
                *@users.noreply.github.com|*@noreply.github.com) ;;
                *) echo "::error::$SHA carries a real address in its authorship"; FAILED=1 ;;
              esac
            done
          done
          exit $FAILED

  # THE PINS, RUN RATHER THAN READ. Every job above resolves each dependency to
  # the newest release its range admits, so a range is only ever exercised at one
  # end -- and the end that is not exercised is the floor, which is the end a
  # consumer with an older install actually lands on. This job installs every
  # release each declared range claims, plus the highest release below it, and
  # runs the suite against each one.
  #
  # It derives the ranges from `pyproject.toml` rather than naming versions here.
  # A version written in this file would keep passing after somebody raised the
  # real one, and the day a new release lands inside a range this job picks it up
  # without being edited.
  #
  # It fails on a could-not-run as well as on a refutation. If the index is
  # unreachable the answer is not *the pins are fine*, so a red here can mean
  # network trouble -- which is the correct cost of not having a vacuous green.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the probe's own needs
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install virtualenv packaging

      - name: Every release each pin claims
        run: python3 battery/probe_pin.py

  # THE GRADER, RUN. `battery/qa_vertical.py` registers this tool with
  # `qa-orchestrator` as a referee and a tier, and `battery/scenarios/` drives a
  # tracker through the three answers this package exists to keep apart. The probe
  # requires all of it, including that the wrong-on-purpose scenario fails for BOTH
  # of its own reasons -- a suite where everything passes cannot tell a working
  # comparator from one that compares nothing.
  #
  # The tool has to be on PATH because the harness runs it as a subprocess, which
  # is the point: this is the only leg that exercises the executable a consumer
  # installs rather than the modules the suite imports.
  grader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[detect,grade]' pytest

      - name: Scenarios parse
        run: |
          set -euo pipefail
          qa-orchestrator --plugin battery/qa_vertical.py check battery/scenarios/*.yaml

      - name: The grader probe
        run: python3 battery/probe_qa_vertical.py

      - name: The engine probe, against the shipped record
        # Re-measures the engine and compares, rather than trusting the record.
        # Writes to a temp path on purpose: a check must not rewrite the thing it is
        # checking, and refreshing the floors is a deliberate act on a pin change.
        #
        # TWO QUESTIONS, AND THIS STEP USED TO ANSWER THEM WITH ONE EXIT CODE.
        #
        #   1. Do the recorded measurements still reproduce AT THE VERSION THE RECORD
        #      NAMES? That is a behaviour claim about this package, it is what the
        #      record is for, and it is a hard failure.
        #   2. Has a newer release appeared inside the pin? That is news from upstream.
        #      Nothing in this repository changed, nobody here did anything wrong, and
        #      the right response is to re-run the probe when somebody is ready to.
        #
        # Installing the newest in-range release and then failing on any difference
        # made every push red the day `arbiter-engine` published, with a message
        # telling the author to re-run a probe they had no reason to think about. The
        # red was scheduled by upstream, not earned by a commit -- and because it fired
        # on the version string before comparing anything, a genuine reproduction
        # failure and a routine upstream release were indistinguishable.
        #
        # So the reproduction runs PINNED to the recorded version, and the newer
        # release is reported as a notice. The `floors` job separately sweeps every
        # release the pin admits, so a new one is still exercised -- it is just not
        # this step's business.
        run: |
          set -euo pipefail
          RECORDED=$(python3 -c "import json; print(json.load(open('src/engagement_deliverable_audit/engine_floors.json'))['engine_version'])")
          python3 -m pip install --quiet "arbiter-engine==${RECORDED}"
          EDA_ENGINE_FLOORS_OUT=/tmp/floors-now.json python3 battery/probe_engine.py > /dev/null
          python3 - <<'PY'
          import json, sys
          now = json.load(open("/tmp/floors-now.json"))
          shipped = json.load(open("src/engagement_deliverable_audit/engine_floors.json"))
          # Now an invariant rather than a race: the install above pinned it. If this
          # ever fires, the pin did not take and the comparison below is meaningless.
          if now["engine_version"] != shipped["engine_version"]:
              sys.exit(f"::error::asked for {shipped['engine_version']} and the probe "
                       f"ran against {now['engine_version']}; the pinned install did "
                       f"not take, so nothing below was compared at the right version")
          drifted = [name for name in shipped["floors"]
                     if now["floors"].get(name) != shipped["floors"][name]]
          drifted += [f"probe {k}" for k, v in shipped["probes"].items()
                      if now["probes"].get(k, {}).get("measured") != v["measured"]]
          if drifted:
              sys.exit(f"::error::these measurements no longer reproduce at "
                       f"{shipped['engine_version']}: {drifted}")
          print(f"{len(shipped['probes'])} probe(s) reproduced against "
                f"{shipped['engine_version']}")
          PY

      - name: Is there a newer engine inside the pin
        # ADVISORY, and deliberately the last thing in the job. A newer release is
        # information, not a defect in this commit, so it annotates and does not fail.
        # `continue-on-error` is not used because nothing here exits non-zero: the
        # distinction is in what the step DOES, not in whether its failure is ignored.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          shipped = json.load(open("src/engagement_deliverable_audit/engine_floors.json"))
          recorded = shipped["engine_version"]
          sys.path.insert(0, "battery")
          from packaging.version import Version
          import probe_pin
          pin = probe_pin.declared_pins()["arbiter-engine"]
          in_range, _below = probe_pin.candidates("arbiter-engine", pin)
          newer = [str(v) for v in in_range if v > Version(recorded)]
          if newer:
              print(f"::notice::the record was measured against {recorded}; "
                    f"{', '.join(newer)} now also satisfy {pin}. Re-run "
                    f"battery/probe_engine.py and commit the record when convenient. "
                    f"The floors job already runs the suite against every one of them.")
          else:
              print(f"{recorded} is the newest release {pin} admits")
          PY
